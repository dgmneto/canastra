[package]
name = "canastra-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "JavaScript and wasm bindings for the Canastra engine"

[lib]
# rlib alongside cdylib so the crate still builds and tests natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
canastra-engine.workspace = true
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
serde_json = "1"
