[package]
name = "canastra-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Rules engine and state machine for Canastra (house rules)"

[dependencies]
rand_chacha.workspace = true
rand_core.workspace = true
# Not optional: every consumer of this crate crosses a serialization boundary
# (JSON for the server, JS values for wasm), and gating the derives behind a
# feature would put a cfg_attr on every public type for no real gain.
serde.workspace = true

[dev-dependencies]
serde_json = "1"
