[package]
name = "canastra-train"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "GA training for Canastra policy networks (pure Rust, no Python)"

[lib]
name = "canastra_train"
path = "src/lib.rs"

[[bin]]
name = "canastra-train"
path = "src/bin/train.rs"

[[bin]]
name = "canastra-bench"
path = "src/bin/bench.rs"

[[bin]]
name = "canastra-h2d-bench"
path = "src/bin/h2d_bench.rs"
required-features = ["cuda"]

[[bin]]
name = "canastra-sparsity"
path = "src/bin/sparsity.rs"

[[bin]]
name = "canastra-ksweep"
path = "src/bin/ksweep.rs"

# Correctness gate for the optimisation harness. CPU-only, deterministic,
# byte-identical golden comparison. Not a hot path — harness infrastructure.
[[bin]]
name = "gate"
path = "src/bin/gate.rs"

[workspace]

[dependencies]
canastra-engine = { path = "../engine/crates/canastra-engine" }
canastra-encode = { path = "../engine/crates/canastra-encode" }

# GPU forward pass via candle (pure Rust ML framework).
# CUDA feature requires nvcc (CUDA Toolkit). Enable with:
#   cargo build --features cuda
candle-core = { version = "0.11" }
candle-nn = { version = "0.11" }

# Parallelism
rayon = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# CLI
clap = { version = "4", features = ["derive"] }

# RNG
rand = { version = "0.8", features = ["std_rng"] }

# Misc
anyhow = "1"

# Pinned-memory H2D microbenchmark (cuda-only). Same version candle pulls in.
cudarc = { version = "0.19", optional = true }

[features]
cuda = ["candle-core/cuda", "dep:cudarc"]
# Coarse per-generation timing breakdown (Phase 0 profiling). Throwaway —
# Phase 1 rewrites the rollout and drops this. Adds a small cost via Instant
# spans and atomic counters; do not enable for production runs.
profile = []
