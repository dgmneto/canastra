[build-system]
requires = ["maturin>=1.7"]
build-backend = "maturin"

[project]
name = "canastra-train"
version = "0.1.0"
description = "Training harness for Canastra policy networks"
requires-python = ">=3.11"
dependencies = ["numpy", "torch"]

[project.optional-dependencies]
dev = ["maturin", "pytest", "ruff", "mypy"]

[tool.maturin]
python-source = "python"
module-name = "canastra_py"
features = ["pyo3/extension-module"]

[tool.ruff]
target-version = "py311"

[tool.mypy]
strict = true
mypy_path = "python"
